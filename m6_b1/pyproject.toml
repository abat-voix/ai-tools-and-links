[project]
name = "m6-b1-naive-agent"
version = "0.1.0"
description = "Наивный агент на Chat Completions: цикл, инструменты, трасса"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
